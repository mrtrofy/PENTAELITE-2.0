<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SISTEMA PENTATLÓN MODERNO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: linear-gradient(135deg, #020617 0%, #0f172a 50%, #1e1b4b 100%);
      min-height: 100vh;
    }
    .glass-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(99, 102, 241, 0.2);
    }
    .tab-active {
      background: linear-gradient(90deg, #3b82f6, #6366f1);
      color: #fff;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
    }
    .tab-inactive {
      color: #94a3b8;
      background: transparent;
    }
    .tab-inactive:hover {
      color: #e2e8f0;
      background: rgba(255,255,255,0.05);
    }
    .input-field {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #e2e8f0;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-field:focus {
      outline: none;
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }
    .input-field::placeholder {
      color: #475569;
    }
    .btn-primary {
      background: linear-gradient(90deg, #3b82f6, #6366f1);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 25px rgba(99, 102, 241, 0.5);
    }
    .btn-primary:active {
      transform: translateY(0);
    }
    .btn-google {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #e2e8f0;
      transition: transform 0.15s, background 0.2s, box-shadow 0.15s;
    }
    .btn-google:hover {
      background: rgba(51, 65, 85, 0.9);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
    }
    .btn-google:active {
      transform: translateY(0);
    }
    .divider-line {
      border-color: rgba(99, 102, 241, 0.2);
    }
    .sport-icon-glow {
      filter: drop-shadow(0 0 12px rgba(99, 102, 241, 0.6));
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-in {
      animation: fadeIn 0.5s ease forwards;
    }
  </style>
</head>
<body id="authSection" style="display:none" class="flex items-center justify-center min-h-screen p-4">

  <div class="glass-card rounded-2xl shadow-2xl w-full max-w-md p-8 fade-in">

    <!-- Header / Logo -->
    <div class="flex flex-col items-center mb-8">
      <!-- Sport icon SVG -->
      <div class="sport-icon-glow mb-4">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="72" height="72" fill="none">
          <!-- Runner body -->
          <circle cx="40" cy="14" r="7" fill="#6366f1"/>
          <!-- Torso/legs running pose -->
          <line x1="40" y1="21" x2="40" y2="45" stroke="#6366f1" stroke-width="4" stroke-linecap="round"/>
          <!-- Left arm -->
          <line x1="40" y1="30" x2="24" y2="38" stroke="#3b82f6" stroke-width="3.5" stroke-linecap="round"/>
          <!-- Right arm (back) -->
          <line x1="40" y1="30" x2="56" y2="24" stroke="#3b82f6" stroke-width="3.5" stroke-linecap="round"/>
          <!-- Left leg forward -->
          <line x1="40" y1="45" x2="26" y2="62" stroke="#6366f1" stroke-width="3.5" stroke-linecap="round"/>
          <!-- Right leg back -->
          <line x1="40" y1="45" x2="54" y2="58" stroke="#6366f1" stroke-width="3.5" stroke-linecap="round"/>
          <!-- Left foot -->
          <line x1="26" y1="62" x2="18" y2="66" stroke="#818cf8" stroke-width="3" stroke-linecap="round"/>
          <!-- Right foot -->
          <line x1="54" y1="58" x2="62" y2="66" stroke="#818cf8" stroke-width="3" stroke-linecap="round"/>
          <!-- Star / award accent -->
          <polygon points="68,6 70,12 76,12 71,16 73,22 68,18 63,22 65,16 60,12 66,12"
                   fill="#fbbf24" opacity="0.9"/>
        </svg>
      </div>

      <h1 class="text-2xl font-extrabold tracking-widest text-white uppercase text-center leading-tight">
        PENTATLÓN MODERNO
      </h1>
      <p class="text-slate-400 text-sm mt-1 tracking-wider text-center">
        Sistema de Gestión de Competencias
      </p>
    </div>

    <!-- Tabs -->
    <div class="flex rounded-lg overflow-hidden mb-6 p-1 bg-slate-800/60">
      <button id="tab-login"
              class="flex-1 py-2.5 text-sm font-semibold rounded-md transition-all duration-200 tab-active"
              onclick="switchTab('login')">
        Iniciar Sesión
      </button>
      <button id="tab-register"
              class="flex-1 py-2.5 text-sm font-semibold rounded-md transition-all duration-200 tab-inactive"
              onclick="switchTab('register')">
        Crear Cuenta
      </button>
    </div>

    <!-- Auth Form -->
    <form id="authForm" novalidate>
      <div class="space-y-4">
        <!-- Email -->
        <div>
          <label for="email" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">
            Correo electrónico
          </label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="correo@ejemplo.com"
            required
            autocomplete="email"
            class="input-field w-full rounded-lg px-4 py-3 text-sm"
          />
        </div>

        <!-- Password -->
        <div>
          <label for="password" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">
            Contraseña
          </label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="••••••••"
            required
            autocomplete="current-password"
            class="input-field w-full rounded-lg px-4 py-3 text-sm"
          />
        </div>

        <!-- Submit -->
        <button
          type="submit"
          id="submitBtn"
          class="btn-primary w-full py-3 rounded-lg text-white font-bold text-sm uppercase tracking-wider mt-2">
          Iniciar Sesión
        </button>
      </div>
    </form>

    <!-- Divider -->
    <div class="flex items-center my-5 gap-3">
      <hr class="flex-1 divider-line" />
      <span class="text-slate-500 text-xs uppercase tracking-widest">o continúa con</span>
      <hr class="flex-1 divider-line" />
    </div>

    <!-- Google Sign-In -->
    <button id="googleBtn" type="button"
            class="btn-google w-full flex items-center justify-center gap-3 py-3 rounded-lg font-semibold text-sm">
      <!-- Google SVG icon -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="20" height="20">
        <path fill="#EA4335" d="M24 9.5c3.1 0 5.9 1.1 8.1 2.9l6-6C34.4 3.1 29.5 1 24 1 14.8 1 7 6.7 3.7 14.6l7 5.4C12.4 13.5 17.7 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.8 7.2l7.4 5.7c4.3-4 6.8-9.9 6.8-16.9z" />
        <path fill="#FBBC05" d="M10.7 28.5A14.6 14.6 0 0 1 9.5 24c0-1.6.3-3.1.7-4.5l-7-5.4A23.9 23.9 0 0 0 0 24c0 3.9.9 7.5 2.5 10.7l7.5-5.8-.3-.4z"/>
        <path fill="#34A853" d="M24 47c5.5 0 10.1-1.8 13.4-4.9l-7.4-5.7c-1.8 1.2-4.1 2-6 2-6.3 0-11.6-4-13.5-9.5l-7.5 5.8C7 42.3 14.8 47 24 47z"/>
        <path fill="none" d="M0 0h48v48H0z"/>
      </svg>
      Continuar con Google
    </button>

    <!-- Footer note -->
    <p class="text-center text-slate-600 text-xs mt-6">
      Sistema Pentatlón Moderno &copy; <span id="year"></span>
    </p>
  </div>

  <script>
    // Set current year in footer
    document.getElementById('year').textContent = new Date().getFullYear();

    // Estado del formulario: 'login' o 'register'
    window.authMode = 'login';

    // Tab switching — también actualiza window.authMode para que script.js lo lea
    function switchTab(tab) {
      window.authMode = tab;
      const loginTab    = document.getElementById('tab-login');
      const registerTab = document.getElementById('tab-register');
      const submitBtn   = document.getElementById('submitBtn');
      const pwdInput    = document.getElementById('password');

      if (tab === 'login') {
        loginTab.className    = 'flex-1 py-2.5 text-sm font-semibold rounded-md transition-all duration-200 tab-active';
        registerTab.className = 'flex-1 py-2.5 text-sm font-semibold rounded-md transition-all duration-200 tab-inactive';
        submitBtn.textContent = 'Iniciar Sesión';
        pwdInput.setAttribute('autocomplete', 'current-password');
      } else {
        registerTab.className = 'flex-1 py-2.5 text-sm font-semibold rounded-md transition-all duration-200 tab-active';
        loginTab.className    = 'flex-1 py-2.5 text-sm font-semibold rounded-md transition-all duration-200 tab-inactive';
        submitBtn.textContent = 'Crear Cuenta';
        pwdInput.setAttribute('autocomplete', 'new-password');
      }
    }
  </script>

  <script type="module" src="script.js"></script>
</body>
</html>
